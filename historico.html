<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico do cliente | Fidelidade</title>
    <link rel="icon" type="image/png" href="img/logos/OliveiraPizzaria.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/cartao.css?v=20261020" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-md app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img class="brand-logo" src="img/logos/OliveiraPizzaria.png" alt="">
                Pizzaria Oliveira - Cartão Fidelidade
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation"
                    aria-controls="main-navigation" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="main-navigation">
                <div class="navbar-nav ms-auto align-items-md-center gap-md-2">
                    <a class="nav-link admin-link" href="clientes.html" hidden>Clientes</a>
                    <a class="nav-link admin-link" href="cadastro.html" hidden>Cadastrar cliente</a>
                    <a class="nav-link login-link" href="login.html">Entrar</a>
                    <a class="nav-link logout-link" href="login.html" hidden>Sair</a>
                    <a class="nav-link account-link fw-semibold" href="conta.html">
                        <span id="header-person-name">Minha conta</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div id="api-status" class="alert alert-secondary" role="status" hidden></div>
        <section id="admin-denied" class="alert alert-warning" hidden>
            O histórico é restrito à equipe da empresa. <a href="login.html">Entrar como administrador</a>.
        </section>
        <section id="admin-content" hidden aria-labelledby="page-title">
            <a class="small text-secondary" href="clientes.html">← Voltar para clientes</a>
            <p class="eyebrow mt-4 mb-2">HISTÓRICO DE FIDELIDADE</p>
            <h1 id="page-title" class="h2 mb-1"></h1>
            <p id="customer-contact" class="text-secondary mb-3"></p>
            <div id="stamp-actions" class="d-flex flex-wrap align-items-center gap-3 mb-4" hidden>
                <button id="add-stamp" class="btn btn-dark" type="button">Adicionar carimbo</button>
                <span id="stamp-message" class="small" role="status" aria-live="polite"></span>
            </div>
            <p id="customer-not-found" class="alert alert-warning" hidden>Cliente não encontrado.</p>
            <div id="loyalty-history" class="row g-3"></div>
        </section>
    </main>

    <script src="js/config.js?v=20261020"></script>
    <script src="js/api.js?v=20261020"></script>
    <script src="js/app.js?v=20261020"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
