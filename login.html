<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Fidelidade</title>
    <link rel="icon" type="image/png" href="img/logos/OliveiraPizzaria.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/cartao.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5">
        <section class="auth-card card-preview mx-auto p-4 p-sm-5" aria-labelledby="page-title">
            <a class="navbar-brand fw-bold mb-4" href="index.html">
                <img class="brand-logo" src="img/logos/OliveiraPizzaria.png" alt="">
                Pizzaria Oliveira - sistema fidelidade
            </a>
            <p class="eyebrow mb-2">FIDELIDADE</p>
            <h1 id="page-title" class="h2 mb-2">Entrar</h1>
            <p class="text-secondary mb-4">Acesse sua conta para ver seu cartão ou gerenciar clientes.</p>

            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label" for="login-email">E-mail</label>
                    <input class="form-control" id="login-email" type="email" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="login-password">Senha</label>
                    <div class="input-group">
                        <input class="form-control" id="login-password" type="password"
                               autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" id="toggle-login-password" type="button"
                                aria-label="Mostrar senha" aria-pressed="false" aria-controls="login-password">
                            <svg class="password-toggle-icon" id="login-password-eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"
                                 aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="password-toggle-icon" id="login-password-eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"
                                 aria-hidden="true" style="display: none">
                                <path d="M2 12s3.6 6 10 6 10-6 10-6"/>
                                <path d="M7 7 5.5 5M12 6V3.5M17 7l1.5-2"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button class="btn btn-dark w-100" type="submit">Entrar</button>
                <p id="login-message" class="small mt-3 mb-0" role="status" aria-live="polite"></p>
            </form>
            <p class="small text-center mt-4 mb-0">
                Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
        </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
