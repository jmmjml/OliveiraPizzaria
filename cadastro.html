<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar cliente | Fidelidade</title>
    <link rel="icon" type="image/png" href="img/logos/OliveiraPizzaria.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/cartao.css?v=20261020" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-md app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img class="brand-logo" src="img/logos/OliveiraPizzaria.png" alt="">
                Pizzaria Oliveira - Cartão Fidelidade
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation"
                    aria-controls="main-navigation" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="main-navigation">
                <div class="navbar-nav ms-auto align-items-md-center gap-md-2">
                    <a class="nav-link admin-link" href="clientes.html" hidden>Clientes</a>
                    <a class="nav-link admin-link" href="cadastro.html" hidden>Cadastrar cliente</a>
                    <a class="nav-link logout-link" href="login.html" hidden>Sair</a>
                    <a class="nav-link account-link fw-semibold" href="conta.html">
                        <span id="header-person-name">Minha conta</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div id="api-status" class="alert alert-secondary" role="status" hidden></div>
        <section id="registration-content" class="mx-auto" style="max-width: 720px" aria-labelledby="page-title">
            <p class="eyebrow mb-2">FIDELIDADE</p>
            <h1 id="page-title" class="h2 mb-4">Criar conta</h1>
            <form id="registration-form" class="card-preview p-4 p-md-5">
                <div class="mb-3">
                    <label class="form-label" for="customer-name">Nome completo</label>
                    <input class="form-control" id="customer-name" name="nome" autocomplete="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="customer-email">E-mail</label>
                    <input class="form-control" id="customer-email" name="email" type="email"
                           autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="customer-phone">Número de contato (com DDD)</label>
                    <input class="form-control" id="customer-phone" name="telefone" type="tel"
                           inputmode="numeric" autocomplete="tel" placeholder="(18) 90000-0000" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="customer-password">Senha provisória</label>
                    <div class="input-group">
                        <input class="form-control" id="customer-password" name="senha" type="password"
                               minlength="6" autocomplete="new-password" required>
                        <button class="btn btn-outline-secondary" id="toggle-customer-password" type="button"
                                aria-label="Mostrar senha" aria-pressed="false" aria-controls="customer-password">
                            <svg class="password-toggle-icon" id="password-eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"
                                 aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="password-toggle-icon" id="password-eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"
                                 aria-hidden="true" style="display: none">
                                <path d="M2 12s3.6 6 10 6 10-6 10-6"/>
                                <path d="M7 7 5.5 5M12 6V3.5M17 7l1.5-2"/>
                            </svg>
                        </button>
                    </div>
                    <div class="form-text">Mínimo de 6 caracteres. A API guarda a senha criptografada.</div>
                </div>
                <button class="btn btn-dark" type="submit">Salvar cadastro</button>
                <p id="registration-message" class="small mt-3 mb-0" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="js/config.js?v=20261020"></script>
    <script src="js/api.js?v=20261020"></script>
    <script src="js/app.js?v=20261020"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
