<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#201d19">
    <title>Cartão fidelidade</title>
    <link rel="icon" type="image/png" href="img/logos/OliveiraPizzaria.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/cartao.css?v=20261020" rel="stylesheet">
    <link href="css/animacao-carregamento.css?v=20261020" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-md app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img class="brand-logo" src="img/logos/OliveiraPizzaria.png" alt="">
                Pizzaria Oliveira - Cartão Fidelidade
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#main-navigation" aria-controls="main-navigation"
                    aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="main-navigation">
                <div class="navbar-nav ms-auto align-items-md-center gap-md-2">
                    <a class="nav-link admin-link" href="clientes.html" hidden>Clientes</a>
                    <a class="nav-link admin-link" href="cadastro.html" hidden>Cadastrar cliente</a>
                    <a class="nav-link login-link" href="login.html">Entrar</a>
                    <a class="nav-link logout-link" href="login.html" hidden>Sair</a>
                    <a class="nav-link account-link fw-semibold" href="conta.html">
                        <span id="header-person-name">Minha conta</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div id="api-status" class="alert alert-secondary" role="status" hidden></div>
        <section class="loyalty-page mx-auto" aria-labelledby="page-title">
            <header class="text-center mb-4">
                <p class="eyebrow mb-2">SEU PROGRAMA DE FIDELIDADE</p>
                <h1 id="page-title" class="h2 mb-2">Seu cartão</h1>
                <p id="company-name" class="text-secondary mb-0"></p>
            </header>

            <div class="card-preview p-3 p-sm-4">
                <div class="card-toolbar d-flex justify-content-between align-items-center gap-3 mb-3">
                    <span id="card-side-label" class="small fw-semibold">Frente do cartão</span>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Escolher lado do cartão">
                        <button id="show-front" class="btn btn-outline-dark active" type="button"
                                aria-pressed="true" aria-controls="loyalty-card">
                            Frente
                        </button>
                        <button id="show-back" class="btn btn-outline-dark" type="button"
                                aria-pressed="false" aria-controls="loyalty-card">
                            Verso
                        </button>
                    </div>
                </div>

                <div id="loyalty-card" class="loyalty-card" aria-live="polite">
                    <img id="card-art" class="card-art" src="" alt="">
                    <div id="stamp-grid" class="stamp-grid" aria-label="Carimbos do cartão"></div>
                    <span id="card-customer-name" class="card-customer-name"></span>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3">
                    <span id="stamp-progress" class="small fw-semibold"></span>
                    <span class="small text-secondary">Carimbos</span>
                </div>
                <div class="progress mt-2" role="progressbar" aria-label="Progresso do cartão"
                     aria-valuemin="0" aria-valuemax="10" id="stamp-progress-bar">
                    <div id="stamp-progress-fill" class="progress-bar"></div>
                </div>
            </div>

            <p class="small text-secondary text-center mt-3 mb-0">
                Apresente este cartão a cada compra e acompanhe seus carimbos.
            </p>

            <section class="mt-5" aria-labelledby="history-title">
                <h2 id="history-title" class="h5 mb-3">Seu histórico</h2>
                <div id="client-history" class="d-grid gap-2"></div>
                <p id="client-history-empty" class="small text-secondary mb-0" hidden>
                    Você ainda não tem cartões. Peça seu primeiro carimbo na loja!
                </p>
            </section>
        </section>
    </main>

    <script src="js/config.js?v=20261020"></script>
    <script src="js/api.js?v=20261020"></script>
    <script src="js/app.js?v=20261020"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
